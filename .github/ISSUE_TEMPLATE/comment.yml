# Generated by scripts/gen-comment-form.mjs from spec/mws.md (Annex C). Do not edit by hand:
# change the script or the specification and run `node scripts/gen-comment-form.mjs`.
# The field ids are fixed; links on isokron.ai prefill them.
name: Comment on MWS 0.9
description: Comment on the MCP Write-Safety Requirements, version 0.9 (open until 16 December 2026).
title: "[MWS 0.9 comment] "
labels: ["comment-0.9", "triage:needs-reply"]
body:
  - type: markdown
    attributes:
      value: |
        Comments on MWS 0.9 are open from 16 November to 16 December 2026. Every comment gets a recorded disposition in the [disposition log](https://github.com/isokron-ai/mcp-write-safety/blob/main/spec/COMMENTS-0.9.md). A comment needs no particular form: this one only helps us sort it, and you need not write the change yourself. A proposal for new requirement text can also follow the proposal form in [CONTRIBUTING.md](https://github.com/isokron-ai/mcp-write-safety/blob/main/CONTRIBUTING.md).

        Issues in this repository are public. Do not use this form to report a vulnerability, in the test suite, in the sample server or in anyone else's server: see the [Security section of CONTRIBUTING.md](https://github.com/isokron-ai/mcp-write-safety/blob/main/CONTRIBUTING.md#security).
  - type: dropdown
    id: requirement
    attributes:
      label: Requirement
      description: The requirement your comment is about (Annex C of the specification lists them), or the whole specification.
      options:
        - "General / whole specification"
        - "MWS-UPD-1"
        - "MWS-UPD-2"
        - "MWS-CONC-1"
        - "MWS-CONC-2"
        - "MWS-CONC-3"
        - "MWS-CONC-4"
        - "MWS-CONC-5"
        - "MWS-CONC-6"
        - "MWS-TGT-1"
        - "MWS-TGT-2"
        - "MWS-TGT-3"
        - "MWS-RES-1"
        - "MWS-RES-2"
        - "MWS-RES-3"
        - "MWS-RES-4"
        - "MWS-ATOM-1"
        - "MWS-ATOM-2"
        - "MWS-RETRY-1"
        - "MWS-RETRY-2"
        - "MWS-RETRY-3"
        - "MWS-IN-1"
        - "MWS-IN-2"
        - "MWS-IN-3"
        - "MWS-IN-4"
        - "MWS-IN-5"
        - "MWS-IN-6"
        - "MWS-IN-7"
        - "MWS-CFG-1"
        - "MWS-CFG-2"
        - "MWS-CFG-3"
        - "MWS-CFG-4"
        - "MWS-ANN-1"
        - "MWS-ANN-2"
        - "MWS-ANN-3"
        - "MWS-ANN-4"
        - "MWS-ANN-5"
        - "MWS-SEC-1"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of comment
      options:
        - "The requirement is wrong"
        - "It is unclear"
        - "Something is missing"
        - "Evidence or a counter-example"
        - "Question"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: What you think is wrong, unclear or missing, or what you want to ask. Quote the sentence you mean where you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed text
      description: Optional. The wording you would use instead, or the sentence you would add.
    validations:
      required: false
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: Optional. A link to a public finding, an upstream issue or a failing case.
      placeholder: https://
    validations:
      required: false
