# T0 worker: the tiny-tracker defect matrix. Dispatch only; there is no schedule, push or pull_request trigger.
#
# Builds examples/tiny-tracker and, for each cell, starts the builds, collects the fixture answers with
# expected/generate.mjs (the generator the known-answer files come from) and compares them with the committed rows of
# expected/0.4.0.json (builds listed in expected/builds-0.4.0.json): same build_hash, same FX- answers. scripts/ci/matrix-plan.mjs
# says which cells there are and how a defect cell is judged.
#
#   known-good cell  a correct build (one per level): must reproduce its committed row.
#   defect cell      the defect's single-defect builds (or, for a defect that has none, every build that holds it): each must
#                    reproduce its row, AND the defect must be detected: its fixture answers (run now) differ from the
#                    correct build's at the same level, or its committed contract answers do. A defect that is neither
#                    detected nor listed in the known-answer file's not_detected note is NEUTERED: the cell fails. A defect
#                    with no single-defect build is only checked for reproducing and reported as combo_only.
#
#   defects empty   the control set: "L2 correct build" and defect digest-of-current-state.
#   defects a,b     those defects; each judged as above.
#   defects all     every correct build and every distinct defect of the list. This is what the tool-qa pump dispatches
#                   (t0-defects lane).
#
# Result: the last job builds a tool-qa result bundle (worker-kit), sealed to tool-qa's ingest key, with
# one control `known_good` (every correct build reproduced its row) and one `known_bad` (every defect reproduced its rows and is
# detected or documented). A control that did not hold is rejected by ingest as control_failed: a lead against OUR tool,
# never a subject fault. scripts/ci/t0-bundle.mjs builds it.
#
# The fixture answers are run here; the contract answers are the committed ones (the contract driver is not checked out
# here). mcp-writecheck itself is run in the same job (added 27 Nov): the CLI is built from packages/writecheck at the
# commit under test, and scripts/ci/writecheck-run.mjs runs it against the built tiny-tracker, with the cell's defect
# switched on (the release default profile, backend and server as separate processes, as `mcp-writecheck demo` does; the
# one backend defect that profile can start, lost-update, goes to the backend). The requirements it reports are compared
# with the defect's expected answer in expected/writecheck-expected-0.4.0.json (generated from the defects' own sources by
# scripts/ci/writecheck-expected.mjs; builds-0.4.0.json has no such metadata):
#
#   writecheck_detected  true when it reported every expected requirement; false when it did not (a CONTROL MISS, a lead
#                        against OUR tool: the cell fails with reason writecheck_missed); null when nothing is expected of it
#                        (lookup-reexecutes, the fixture-only backend defects) or it did not run.
#   writecheck_clean     a correct build: it must report no violation (else reason writecheck_violated).
#
# They are reported beside the statuses above, which are unchanged: a documented, combo_only or committed_contract defect
# that mcp-writecheck caught keeps its status and is judged for known_bad (writecheck_detected true).
#
# Input mode (added 28 Nov): `full` (the default, as above) or `min`. In min mode the cell runs `mcp-writecheck min` instead
# (scripts/ci/writecheck-min.mjs): tiny-tracker's backend is replaced by the mock made from examples/tiny-tracker/openapi.yaml,
# and the answer is judged against what min mode may say (packages/writecheck/src/min/requirements-min.json): a defect whose
# requirement min mode judges must be violated (or answered "no" on a review-only clause); a defect whose requirement needs
# real backend semantics must come out not_testable_mock (never held); a correct build must be clean. A backend defect has no
# backend to go to in min mode, so its build is the correct MCP layer against the mock (lost-update: MWS-CONC-3 not_testable_mock).
#
# No secrets. The first job does nothing unless the repository variable LOOP_ENABLED is exactly "true".

name: defect-matrix

run-name: shard ${{ inputs.shard_id }}${{ inputs.mode == 'min' && ' (min mode)' || '' }}

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      defects:
        description: Comma-separated defect names (lowercase letters, digits, hyphen; at most 20), or the word all. Empty runs the control set only.
        required: false
        default: ''
        type: string
      mode:
        description: full (the default, tiny-tracker's real backend) or min (min mode, the backend replaced by the mock made from examples/tiny-tracker/openapi.yaml; scripts/ci/writecheck-min.mjs).
        required: false
        default: full
        type: string

permissions: {}

concurrency:
  group: defect-matrix-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
      cells: ${{ steps.guard.outputs.cells }}
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
          IN_DEFECTS: ${{ inputs.defects }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          if [ -n "$IN_DEFECTS" ] && [ "$IN_DEFECTS" != "all" ]; then
            check defects "$IN_DEFECTS" '^[a-z0-9-]+(,[a-z0-9-]+){0,19}$'
          fi
          mode="${IN_MODE:-full}"
          check mode "$mode" '^(full|min)$'
          [ "$bad" -eq 0 ] || exit 1
          cells="$(node scripts/ci/matrix-plan.mjs cells "$IN_DEFECTS")"
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
            echo "cells=$cells"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: t0-start
    if: needs.t0-start.outputs.go == 'true'
    name: build ${{ matrix.kind }} ${{ matrix.defect || matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.t0-start.outputs.cells) }}
    defaults:
      run:
        working-directory: examples/tiny-tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Build mcp-writecheck (the CLI under test, from this commit)
        working-directory: packages/writecheck
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Run the cell
        working-directory: .
        env:
          WRITECHECK_CLI: ${{ github.workspace }}/packages/writecheck/dist/src/cli/main.js
          KIND: ${{ matrix.kind }}
          LABEL: ${{ matrix.label }}
          DEFECT: ${{ matrix.defect }}
          MODE: ${{ needs.t0-start.outputs.mode }}
        run: node scripts/ci/matrix-cell.mjs "$RUNNER_TEMP/cell"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: t0cell-${{ needs.t0-start.outputs.attempt_id }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cell/cell.json
          if-no-files-found: ignore
          retention-days: 3

  t0-manifest:
    needs: [t0-start, build]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the cells' code: it only reads their result files and builds the sealed bundle.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: t0cell-${{ needs.t0-start.outputs.attempt_id }}-*
          path: ${{ runner.temp }}/cells
      - name: Build the result bundle
        env:
          CELLS: ${{ needs.t0-start.outputs.cells }}
        run: |
          mkdir -p "$RUNNER_TEMP/cells" "$RUNNER_TEMP/out"
          node scripts/ci/t0-bundle.mjs --cells "$RUNNER_TEMP/cells" --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
